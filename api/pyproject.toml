[project]
name = "eveready-demand-api"
version = "0.1.0"
description = "FastAPI service for the Eveready demand forecasting demo"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "numpy",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.uv]
package = false          # an application, not a library: just install the dependencies

[tool.pytest.ini_options]
testpaths = ["."]
